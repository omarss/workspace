# Local Compose stack for SaaS platform development.
#
# Sentinel dev-only credentials (do NOT use in prod):
#   postgres:        user=saas pass=saas db=saas
#   keycloak admin:  admin / admin
#
# OpenBao runs against a file backend with scripted Shamir 5-of-3 unseal.
# The init shares + root token are captured under /openbao/secrets (tmpfs),
# so a container restart re-initialises (acceptable for local dev — see
# docs/adr/006-openbao-shamir-and-kms-roadmap.md). Production swaps the
# tmpfs share path for cloud KMS auto-unseal.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
      POSTGRES_DB: saas
    # Bind to 55432 on the host so we don't collide with the host's own
    # Postgres on 5432 (qudrat lives there). Inside compose the canonical
    # port is still 5432 — DSNs from other containers use postgres:5432.
    ports: ["55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "saas"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
    ports: ["8081:8080"]
    volumes:
      - ./deploy/keycloak/realms:/opt/keycloak/data/import:ro
    depends_on:
      mailhog:
        condition: service_started

  # Phase 5: Mailhog catches the verify-email + password-reset emails
  # Keycloak sends in local dev. UI on :8025; SMTP on :1025.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ["1025:1025", "8025:8025"]

  openbao:
    image: openbao/openbao:2.5.4
    # OpenBao 2.5+ dropped mlock support so we no longer add IPC_LOCK to
    # the container. Swap-side protection is the host's responsibility:
    # disabled or LUKS-encrypted swap. See docs/adr/006.
    environment:
      BAO_ADDR: "http://0.0.0.0:8200"
      BAO_LOG_LEVEL: info
    volumes:
      - openbao-data:/openbao/data
      - openbao-logs:/openbao/logs
      # /openbao/secrets holds the init.json with Shamir shares + root token.
      # For LOCAL DEV ONLY this is a named volume so container restarts can
      # auto-unseal. Production swaps to cloud KMS auto-unseal (no share file
      # on disk). See docs/adr/006 for the trade-off.
      - openbao-secrets:/openbao/secrets
      - ./deploy/openbao/config:/openbao/config:ro
      - ./deploy/openbao/init:/openbao/init:ro
    entrypoint: ["/bin/sh", "/openbao/init/entrypoint.sh"]
    ports: ["8200:8200"]
    healthcheck:
      # sealedcode=204 lets the healthcheck succeed once the bootstrap script
      # finishes unsealing. uninitcode=501 means a fresh container hasn't yet
      # initialised — still acceptable; the bootstrap then runs.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=204"]
      interval: 3s
      timeout: 2s
      retries: 50

  # Phase 6: Novu v3.15.0 self-hosted stack (4 services + mongo + redis).
  # Per ADR 013 the platform wraps Novu as the notifications backbone.
  #
  # DEV-ONLY sentinel values for JWT_SECRET / STORE_ENCRYPTION_KEY /
  # NOVU_SECRET_KEY. In production these load from OpenBao KV at boot:
  #   secret/data/<deployment_id>/notifications/novu_jwt_secret
  #   secret/data/<deployment_id>/notifications/novu_store_encryption_key
  #   secret/data/<deployment_id>/notifications/novu_secret_key
  #
  # CRITICAL: STORE_ENCRYPTION_KEY must be EXACTLY 32 characters or Novu
  # silently refuses to boot (no error logged). The dev sentinel below is
  # padded to that length on purpose; do not "fix" it.
  mongodb:
    image: mongo:8.0.17
    environment:
      MONGO_INITDB_ROOT_USERNAME: novu
      MONGO_INITDB_ROOT_PASSWORD: novu-dev
    volumes: ["novu-mongo:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 30

  novu-api:
    image: ghcr.io/novuhq/novu/api:3.15.0
    depends_on:
      mongodb: { condition: service_healthy }
      redis:   { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: "3000"
      MONGO_URL: "mongodb://novu:novu-dev@mongodb:27017/novu-db?authSource=admin"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # 32-byte hex tokens (DEV ONLY — rotate in prod via OpenBao).
      JWT_SECRET: "dev-novu-jwt-secret-32-bytes-hex!"
      STORE_ENCRYPTION_KEY: "dev-store-key-exactly-32-chars!!"
      NOVU_SECRET_KEY: "dev-novu-secret-key-32-bytes-hex"
      IS_SELF_HOSTED: "true"
      IS_V2_ENABLED: "true"
      MONGO_AUTO_CREATE_INDEXES: "true"
      API_ROOT_URL: "http://localhost:3000"
      FRONT_BASE_URL: "http://localhost:4000"
      DISABLE_USER_REGISTRATION: "false"
      # Novu v3.15 self-host requires STEP_RESOLVER_DISPATCH_URL: the v2
      # echo-engine bridge resolves step definitions over HTTP. Without a
      # dedicated bridge service we point it at the API itself (the
      # documented dev pattern). Missing this variable causes the API to
      # crash-loop with "STEP_RESOLVER_DISPATCH_URL is not defined".
      STEP_RESOLVER_DISPATCH_URL: "http://novu-api:3000/v1/events"
      # NEW_RELIC is referenced unconditionally by Novu's instrumentation
      # bootstrap; "false" silences a noisy non-fatal init failure.
      NEW_RELIC_ENABLED: "false"
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/v1/health-check"]
      interval: 5s
      timeout: 3s
      retries: 60

  novu-worker:
    image: ghcr.io/novuhq/novu/worker:3.15.0
    depends_on:
      mongodb: { condition: service_healthy }
      redis:   { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: "3004"
      MONGO_URL: "mongodb://novu:novu-dev@mongodb:27017/novu-db?authSource=admin"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      STORE_ENCRYPTION_KEY: "dev-store-key-exactly-32-chars!!"
      NOVU_SECRET_KEY: "dev-novu-secret-key-32-bytes-hex"
      API_ROOT_URL: "http://novu-api:3000"
      BROADCAST_QUEUE_CHUNK_SIZE: "100"
      MULTICAST_QUEUE_CHUNK_SIZE: "100"
      # Same v3.15 requirements as novu-api — see the api block above.
      STEP_RESOLVER_DISPATCH_URL: "http://novu-api:3000/v1/events"
      NEW_RELIC_ENABLED: "false"

  novu-ws:
    image: ghcr.io/novuhq/novu/ws:3.15.0
    depends_on:
      mongodb: { condition: service_healthy }
      redis:   { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: "3002"
      MONGO_URL: "mongodb://novu:novu-dev@mongodb:27017/novu-db?authSource=admin"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: "dev-novu-jwt-secret-32-bytes-hex!"
    ports: ["3002:3002"]

  novu-dashboard:
    image: ghcr.io/novuhq/novu/dashboard:3.15.0
    depends_on:
      novu-api: { condition: service_healthy }
    environment:
      VITE_API_HOSTNAME: "http://localhost:3000"
      VITE_WEBSOCKET_HOSTNAME: "http://localhost:3002"
    ports: ["4000:4000"]

  prism-mock-cp:
    image: stoplight/prism:5.15.10
    # `-m=false`: disable multiprocess mode (broken in 5.15.10 container).
    command: ["mock", "-h", "0.0.0.0", "-p", "4010", "-m=false", "/work/openapi/_generated/control-plane.yaml"]
    volumes: [".:/work:ro"]
    ports: ["4010:4010"]

  prism-mock-dp:
    image: stoplight/prism:5.15.10
    command: ["mock", "-h", "0.0.0.0", "-p", "4011", "-m=false", "/work/openapi/_generated/data-plane.yaml"]
    volumes: [".:/work:ro"]
    ports: ["4011:4011"]

volumes:
  pgdata: {}
  openbao-data: {}
  openbao-logs: {}
  openbao-secrets: {}
  novu-mongo: {}
