# Per-Deployment ServiceAccount. Phase 12d (OpenBao Kubernetes auth)
# binds this SA to a per-Deployment OpenBao role, so it MUST be unique
# per namespace; sharing across deployments would leak transit-key access.
# The Deployment template references this name via spec.template.spec.serviceAccountName.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dataplane
  labels:
    app.kubernetes.io/name: dataplane
    app.kubernetes.io/managed-by: saas-controlplane
