# /etc/nginx/snippets/saas-security-headers.conf
# Included by every per-Deployment vhost AND by every location that adds its
# own header — nginx's add_header has no inheritance, so any location with
# its own add_header drops ALL of its parent's headers
# (workspace_personal/CLAUDE.md gotcha #4). Use `include` everywhere; never
# rely on inheritance.

add_header X-Content-Type-Options       "nosniff"                                always;
add_header X-Frame-Options              "DENY"                                   always;
add_header Referrer-Policy              "strict-origin-when-cross-origin"        always;
add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains"    always;
add_header Content-Security-Policy      "default-src 'self'"                     always;
add_header Permissions-Policy           "geolocation=(), microphone=(), camera=()" always;
