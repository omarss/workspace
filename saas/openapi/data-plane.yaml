openapi: 3.1.0
info:
  title: SaaS Data Plane API
  version: 0.0.3
  description: Per-deployment data plane API. One vhost per Deployment under *.saas.omarss.net.
servers:
  - url: https://{env}.{project}.saas.omarss.net
    variables:
      env:
        default: dev
        description: Environment slug (dev, staging, prod).
      project:
        default: example
        description: Project slug for the Deployment.
tags:
  - name: meta
    description: Health and metadata.
  - name: tenants
    description: Tenant CRUD. Tenant is the unit of isolation and billing.
  - name: users
    description: |
      Identity façade for the data plane. Wraps Keycloak; consumers never
      see Keycloak details. Email and other PII are envelope-encrypted at
      rest (see AGENTS.md §18.7).
  - name: social-providers
    description: |
      Social login linking via Keycloak's IdP brokering. POST returns a
      Keycloak-brokered authorization URL — the caller redirects there
      and Keycloak completes the OAuth dance + writes the federated_identity
      row itself. ADR 014 records the design.
  - name: notification-channels
    description: |
      BYOK vendor channel configurations. Per ADR 017 every channel stores
      provider-shaped credentials envelope-encrypted at rest; rotation is a
      distinct verb and credential plaintext is never echoed in any response.
  - name: notification-workflows
    description: |
      Workflow registry: mapping platform-stable workflow names to Novu
      workflow ids. Templates themselves live in Novu.
  - name: notifications
    description: |
      Send and inspect transactional notifications. POST /send returns 202
      Accepted; status transitions are owned by the outbox-consuming worker
      (ADR 013).
  - name: organizations
    description: |
      Organizations group platform users inside a Tenant. Every Tenant gets
      a default organization on creation. Multi-org tenants must opt in via
      tenant.metadata.multi_org.
  - name: members
    description: |
      Memberships link a platform User to an Organization. Role assignment
      lands in Phase 8 RBAC; Phase 7 ships the role_id placeholder column.
  - name: invitations
    description: |
      Pending invitations for an Organization. POST returns 202 with the
      one-time accept URL + plaintext token; subsequent reads return only
      the token_prefix.
  - name: authorization
    description: |
      RBAC roles, permissions, member-role assignments, and the
      synchronous check API. Uses Casbin's RBAC-with-domains model with
      dom = tenant_id (ADR 005). Wildcard domains are forbidden by DB
      CHECK + service-layer validation. Every denied check emits an
      `authorization.denied` outbox event for the Phase 10 audit log.
security:
  - bearerAuth: []
  - apiKeyAuth: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [meta]
      summary: Liveness probe.
      description: Returns 200 with a small status payload when the data plane is alive.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      summary: List tenants visible to the caller's Deployment.
      description: |
        Returns the tenants the caller is authorised to see. In Phase 2 the
        Data Plane caller's token resolves to exactly one tenant, so the list
        contains one element. Operator impersonation across tenants lands in
        Phase 13.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          $ref: "#/components/responses/CursorGone"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Create a tenant. Auto-creates a default Organization.
      description: |
        Idempotent. Replays with the same Idempotency-Key + body return the
        cached 201 response; with the same key + a different body return 422
        idempotency-key-conflict (see AGENTS.md section 5.2).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        "201":
          description: Created
          headers:
            ETag:
              schema:
                type: string
              description: 'Weak ETag, format W/"v<sequence>".'
            Location:
              schema:
                type: string
              description: URI of the created tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/IdempotencyInFlight"
        "422":
          $ref: "#/components/responses/IdempotencyConflictOrValidation"
  /v1/tenants/{tenant_id}:
    parameters:
      - in: path
        name: tenant_id
        required: true
        schema:
          type: string
          pattern: "^tenant_[0-9A-HJKMNP-TV-Z]{26}$"
    get:
      operationId: getTenant
      tags: [tenants]
      summary: Fetch a tenant by id.
      description: Returns the tenant if the caller's tenant context matches the path id; 403 otherwise.
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
              description: 'Weak ETag, format W/"v<sequence>".'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTenant
      tags: [tenants]
      summary: Update a tenant. Idempotent. ETag concurrency control required.
      description: |
        PATCH requires the current Weak ETag in If-Match; a stale ETag returns 412.
        Idempotency-Key replays the cached response when the body hash matches.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantRequest"
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/IdempotencyConflictOrValidation"
    delete:
      operationId: deleteTenant
      tags: [tenants]
      summary: Soft-delete a tenant. Retention applies before physical purge.
      description: |
        Soft-deletes the tenant; status flips to "deleted" and a retention window
        applies before any physical purge (purge endpoint lands in Phase 18).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Soft-deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /v1/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users in the caller's tenant.
      description: |
        Returns the platform users belonging to the caller's tenant. Email
        plaintext is returned (decrypted at the persistence boundary); the
        envelope columns stay on the server. Set the `email` query parameter
        to look up a single user by email (HMAC-prefix lookup; never sends
        plaintext to the DB).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Sort"
        - in: query
          name: email
          required: false
          description: HMAC-prefix lookup; matches on email_lookup_hash.
          schema:
            type: string
            format: email
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          $ref: "#/components/responses/CursorGone"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a platform user. Mirrors the row into Keycloak.
      description: |
        Idempotent. The platform creates a row + a Keycloak user in the
        shared `saas-data-local` realm (per-Deployment realm lands in Phase 12).
        Email is envelope-encrypted; an HMAC-SHA256 lookup hash backs the
        per-tenant uniqueness index.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created
          headers:
            ETag:
              schema:
                type: string
              description: 'Weak ETag, format W/"v<sequence>".'
            Location:
              schema:
                type: string
              description: URI of the created user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/IdempotencyInFlight"
        "422":
          $ref: "#/components/responses/IdempotencyConflictOrValidation"

  /v1/users/{user_id}:
    parameters:
      - in: path
        name: user_id
        required: true
        schema:
          type: string
          pattern: "^user_[0-9A-HJKMNP-TV-Z]{26}$"
    get:
      operationId: getUser
      tags: [users]
      summary: Fetch a platform user by id.
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
              description: 'Weak ETag, format W/"v<sequence>".'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a platform user. ETag concurrency control required.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/IdempotencyConflictOrValidation"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Soft-delete a platform user. Disables the Keycloak user.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Soft-deleted (status=deleted; Keycloak Enabled=false).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /v1/users/{user_id}/disable:
    parameters:
      - in: path
        name: user_id
        required: true
        schema:
          type: string
          pattern: "^user_[0-9A-HJKMNP-TV-Z]{26}$"
    post:
      operationId: disableUser
      tags: [users]
      summary: Disable a platform user. Emits user.disabled.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/users/{user_id}/enable:
    parameters:
      - in: path
        name: user_id
        required: true
        schema:
          type: string
          pattern: "^user_[0-9A-HJKMNP-TV-Z]{26}$"
    post:
      operationId: enableUser
      tags: [users]
      summary: Enable a previously-disabled platform user.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/users/{user_id}/reset-password:
    parameters:
      - in: path
        name: user_id
        required: true
        schema:
          type: string
          pattern: "^user_[0-9A-HJKMNP-TV-Z]{26}$"
    post:
      operationId: triggerPasswordReset
      tags: [users]
      summary: Trigger a password-reset email via Keycloak.
      description: |
        Phase 5 uses Keycloak's built-in SMTP (ExecuteActionsEmail with
        UPDATE_PASSWORD). Phase 6 swaps the transport to the Notifications
        module + Novu without changing this endpoint.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Reset email queued.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/users/{user_id}/verify-email:
    parameters:
      - in: path
        name: user_id
        required: true
        schema:
          type: string
          pattern: "^user_[0-9A-HJKMNP-TV-Z]{26}$"
    post:
      operationId: triggerEmailVerify
      tags: [users]
      summary: Trigger an email-verification action via Keycloak.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Verify-email action queued.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/users/{user_id}/social-providers:
    parameters:
      - in: path
        name: user_id
        required: true
        schema:
          type: string
          pattern: "^user_[0-9A-HJKMNP-TV-Z]{26}$"
    get:
      operationId: listSocialProviders
      tags: [social-providers]
      summary: List linked social providers for a user.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialProviderListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: linkSocialProvider
      tags: [social-providers]
      summary: Start a social-provider link flow. Returns the Keycloak link URL.
      description: |
        Per ADR 014: we never call CreateUserFederatedIdentity from a
        user-facing endpoint (no proof-of-possession). Instead, the platform
        mints Keycloak's hashed link URL — the caller redirects the user's
        browser there and Keycloak completes the OAuth dance with the
        external IdP, writing the federated_identity row itself.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkSocialProviderRequest"
      responses:
        "202":
          description: Accepted; caller must redirect to authorization_url.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkSocialProviderResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/IdempotencyConflictOrValidation"

  /v1/users/{user_id}/social-providers/{provider}:
    parameters:
      - in: path
        name: user_id
        required: true
        schema:
          type: string
          pattern: "^user_[0-9A-HJKMNP-TV-Z]{26}$"
      - in: path
        name: provider
        required: true
        schema:
          type: string
          enum: [google, github, apple]
    delete:
      operationId: unlinkSocialProvider
      tags: [social-providers]
      summary: Unlink a social provider. Emits user.social_unlinked.
      responses:
        "204":
          description: Unlinked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/tenants/{tenant_id}/organizations:
    parameters:
      - in: path
        name: tenant_id
        required: true
        schema:
          type: string
          pattern: "^tenant_[0-9A-HJKMNP-TV-Z]{26}$"
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: List organizations in a tenant.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "410":
          $ref: "#/components/responses/CursorGone"
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Create a new organization in a tenant (multi_org required).
      description: |
        Creating extra organizations requires `tenant.metadata.multi_org=true`.
        The default organization is auto-created on tenant.create and cannot
        be created via this endpoint.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Created
          headers:
            ETag:
              schema:
                type: string
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          description: Multi-org is disabled for this tenant.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          $ref: "#/components/responses/IdempotencyInFlight"
        "422":
          $ref: "#/components/responses/IdempotencyConflictOrValidation"

  /v1/organizations/{organization_id}:
    parameters:
      - in: path
        name: organization_id
        required: true
        schema:
          type: string
          pattern: "^org_[0-9A-HJKMNP-TV-Z]{26}$"
    get:
      operationId: getOrganization
      tags: [organizations]
      summary: Fetch an organization by id.
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateOrganization
      tags: [organizations]
      summary: Update an organization.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/IdempotencyConflictOrValidation"
    delete:
      operationId: deleteOrganization
      tags: [organizations]
      summary: Soft-delete an organization. Refuses while active members remain.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Soft-deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/IdempotencyConflictOrValidation"

  /v1/organizations/{organization_id}/members:
    parameters:
      - in: path
        name: organization_id
        required: true
        schema:
          type: string
          pattern: "^org_[0-9A-HJKMNP-TV-Z]{26}$"
    get:
      operationId: listMembers
      tags: [members]
      summary: List members of an organization.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/CursorGone"

  /v1/organizations/{organization_id}/members/{member_id}:
    parameters:
      - in: path
        name: organization_id
        required: true
        schema:
          type: string
          pattern: "^org_[0-9A-HJKMNP-TV-Z]{26}$"
      - in: path
        name: member_id
        required: true
        schema:
          type: string
          pattern: "^member_[0-9A-HJKMNP-TV-Z]{26}$"
    get:
      operationId: getMember
      tags: [members]
      summary: Fetch a member by id.
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateMember
      tags: [members]
      summary: Update a member's role assignment (Phase 8 RBAC placeholder).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRequest"
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/IdempotencyConflictOrValidation"
    delete:
      operationId: removeMember
      tags: [members]
      summary: Remove a member (soft-delete; status='removed').
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /v1/organizations/{organization_id}/invitations:
    parameters:
      - in: path
        name: organization_id
        required: true
        schema:
          type: string
          pattern: "^org_[0-9A-HJKMNP-TV-Z]{26}$"
    get:
      operationId: listInvitations
      tags: [invitations]
      summary: List invitations for an organization.
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createInvitation
      tags: [invitations]
      summary: Create an invitation. Email is queued; plaintext token returned ONCE.
      description: |
        Returns 202 Accepted because the email dispatch is queued via the
        Notifications module. The response carries `accept_url` and the
        one-time plaintext token alongside `state` + `expires_at`; subsequent
        reads of this invitation return only the `token_prefix`. Never log
        the response body.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "202":
          description: Accepted; invitation persisted + email queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInvitationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyInFlight"
        "422":
          $ref: "#/components/responses/IdempotencyConflictOrValidation"

  /v1/invitations/{invitation_id}:
    parameters:
      - in: path
        name: invitation_id
        required: true
        schema:
          type: string
          pattern: "^inv_[0-9A-HJKMNP-TV-Z]{26}$"
    get:
      operationId: getInvitation
      tags: [invitations]
      summary: Fetch an invitation by id. Plaintext token never echoed.
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: revokeInvitation
      tags: [invitations]
      summary: Revoke a pending invitation. Returns 204.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: Invitation already consumed or expired.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /v1/invitations/{invitation_id}/accept:
    parameters:
      - in: path
        name: invitation_id
        required: true
        schema:
          type: string
          pattern: "^inv_[0-9A-HJKMNP-TV-Z]{26}$"
    post:
      operationId: acceptInvitation
      tags: [invitations]
      summary: Accept a pending invitation. Creates the Member row.
      description: |
        Consumes a one-time accept token. The caller's JWT supplies the user
        identity; the invitation's stored tenant_id is constant-time-compared
        to the caller's tenant. Returns the newly-created Member.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "200":
          description: Member created; invitation consumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: Invitation already consumed, revoked, or expired.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/IdempotencyConflictOrValidation"

  /v1/notification-channels:
    get:
      operationId: listNotificationChannels
      tags: [notification-channels]
      summary: List BYOK notification channels in the caller's tenant.
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannelListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createNotificationChannel
      tags: [notification-channels]
      summary: Create a BYOK notification channel.
      description: |
        Idempotent. Per ADR 017 credentials in the body are envelope-encrypted
        before the row is inserted and the persisted plaintext is zeroed
        immediately. The response NEVER echoes credentials — only a
        credentials_present flag and last_rotated_at timestamp.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotificationChannelRequest"
      responses:
        "201":
          description: Created
          headers:
            ETag:
              schema:
                type: string
              description: 'Weak ETag, format W/"v<sequence>".'
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannelResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/IdempotencyInFlight"
        "422":
          $ref: "#/components/responses/IdempotencyConflictOrValidation"

  /v1/notification-channels/{channel_id}:
    parameters:
      - in: path
        name: channel_id
        required: true
        schema:
          type: string
          pattern: "^chan_[0-9A-HJKMNP-TV-Z]{26}$"
    get:
      operationId: getNotificationChannel
      tags: [notification-channels]
      summary: Fetch a notification channel by id.
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannelResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateNotificationChannel
      tags: [notification-channels]
      summary: Update a notification channel (metadata only).
      description: |
        Per ADR 017 PATCH never accepts credentials. Use the dedicated
        rotate-credentials endpoint to change secrets.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationChannelRequest"
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannelResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/IdempotencyConflictOrValidation"
    delete:
      operationId: deleteNotificationChannel
      tags: [notification-channels]
      summary: Soft-delete a notification channel.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Soft-deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /v1/notification-channels/{channel_id}/rotate-credentials:
    parameters:
      - in: path
        name: channel_id
        required: true
        schema:
          type: string
          pattern: "^chan_[0-9A-HJKMNP-TV-Z]{26}$"
    post:
      operationId: rotateNotificationChannelCredentials
      tags: [notification-channels]
      summary: Rotate a channel's BYOK credentials.
      description: |
        ADR 017: rotation is the only verb that accepts new credentials.
        Bumps row_seq and stamps last_rotated_at; emits the
        notification_channel.rotated audit event.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateChannelCredentialsRequest"
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannelResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/IdempotencyConflictOrValidation"

  /v1/notification-workflows:
    get:
      operationId: listNotificationWorkflows
      tags: [notification-workflows]
      summary: List registered notification workflows for the caller's tenant.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationWorkflowListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: registerNotificationWorkflow
      tags: [notification-workflows]
      summary: Register a (name → Novu workflow id) mapping.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterNotificationWorkflowRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationWorkflowResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/IdempotencyConflictOrValidation"

  /v1/notification-workflows/{workflow_id}:
    parameters:
      - in: path
        name: workflow_id
        required: true
        schema: { type: string }
    patch:
      operationId: updateNotificationWorkflow
      tags: [notification-workflows]
      summary: Update the Novu workflow id and/or description for a registered workflow.
      description: |
        Partial-update endpoint. Either field may be omitted to leave it
        unchanged. Emits a `notification_workflow.updated` outbox event so
        downstream consumers can refresh their cache. Workflow renames
        (changing the `name`) are not supported in v1 — register a new
        workflow with the new name and deprecate the old one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationWorkflowRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationWorkflowResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/IdempotencyConflictOrValidation"

  /v1/notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications in the caller's tenant.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          $ref: "#/components/responses/CursorGone"

  /v1/notifications/send:
    post:
      operationId: sendNotification
      tags: [notifications]
      summary: Queue a notification for delivery via Novu.
      description: |
        Returns 202 Accepted; Novu trigger happens via the outbox worker so
        Novu downtime does not block the request response. Status transitions
        live on the worker — clients poll GET /v1/notifications/{id}.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendNotificationRequest"
      responses:
        "202":
          description: Accepted; notification queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/IdempotencyConflictOrValidation"

  /v1/notifications/{notification_id}:
    parameters:
      - in: path
        name: notification_id
        required: true
        schema:
          type: string
          pattern: "^notif_[0-9A-HJKMNP-TV-Z]{26}$"
    get:
      operationId: getNotification
      tags: [notifications]
      summary: Fetch a notification by id.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/tenants/{tenant_id}/roles:
    parameters:
      - in: path
        name: tenant_id
        required: true
        schema:
          type: string
          pattern: "^tenant_[0-9A-HJKMNP-TV-Z]{26}$"
    get:
      operationId: listRoles
      tags: [authorization]
      summary: List roles in a tenant.
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createRole
      tags: [authorization]
      summary: Create a new role in a tenant.
      description: |
        Roles are tenant-scoped. The optional `permissions` array seeds
        the role's p-rows in a single transaction. Permission ids must
        exist in the deployment-wide catalogue (`/v1/permissions`).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: Created
          headers:
            ETag:
              schema:
                type: string
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/IdempotencyConflictOrValidation"

  /v1/roles/{role_id}:
    parameters:
      - in: path
        name: role_id
        required: true
        schema:
          type: string
          pattern: "^role_[0-9A-HJKMNP-TV-Z]{26}$"
    get:
      operationId: getRole
      tags: [authorization]
      summary: Fetch a role by id.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateRole
      tags: [authorization]
      summary: Update a role. Permissions slice is set-replace.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/IdempotencyConflictOrValidation"
    delete:
      operationId: deleteRole
      tags: [authorization]
      summary: Delete a role. System roles refuse delete with 422.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          description: Role is system-protected.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/permissions:
    get:
      operationId: listPermissions
      tags: [authorization]
      summary: List the deployment-wide permission catalogue.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/members/{member_id}/roles:
    parameters:
      - in: path
        name: member_id
        required: true
        schema:
          type: string
          pattern: "^member_[0-9A-HJKMNP-TV-Z]{26}$"
    get:
      operationId: listMemberRoles
      tags: [authorization]
      summary: List roles assigned to a member.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberRoleListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: assignMemberRole
      tags: [authorization]
      summary: Assign a role to a member.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignMemberRoleRequest"
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberRoleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/IdempotencyConflictOrValidation"

  /v1/members/{member_id}/roles/{role_id}:
    parameters:
      - in: path
        name: member_id
        required: true
        schema:
          type: string
          pattern: "^member_[0-9A-HJKMNP-TV-Z]{26}$"
      - in: path
        name: role_id
        required: true
        schema:
          type: string
          pattern: "^role_[0-9A-HJKMNP-TV-Z]{26}$"
    delete:
      operationId: unassignMemberRole
      tags: [authorization]
      summary: Unassign a role from a member.
      responses:
        "204":
          description: Unassigned
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/authorization/check:
    post:
      operationId: checkAuthorization
      tags: [authorization]
      summary: Evaluate a single (member, permission, tenant) check.
      description: |
        Synchronous policy check. Returns `allowed=true` plus the role
        that matched, or `allowed=false`. Denied checks emit an
        `authorization.denied` outbox event so the audit log records the
        attempt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckAuthorizationRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckAuthorizationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/IdempotencyConflictOrValidation"

  /v1/authorization/batch-check:
    post:
      operationId: batchCheckAuthorization
      tags: [authorization]
      summary: Evaluate many checks in one call (max 100).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCheckAuthorizationRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCheckAuthorizationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/IdempotencyConflictOrValidation"

components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
        commit:
          type: string
    Tenant:
      type: object
      required:
        - id
        - object
        - slug
        - name
        - status
        - created_at
        - updated_at
        - etag
      properties:
        id:
          type: string
          pattern: "^tenant_[0-9A-HJKMNP-TV-Z]{26}$"
        object:
          type: string
          enum: [tenant]
        slug:
          type: string
          minLength: 2
          maxLength: 32
          pattern: "^[a-z][a-z0-9-]*[a-z0-9]$"
        name:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: string
          enum: [active, suspended, deleted]
        default_organization_id:
          type: string
          nullable: true
          pattern: "^org_[0-9A-HJKMNP-TV-Z]{26}$"
        metadata:
          $ref: "#/components/schemas/Metadata"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
        etag:
          type: string
          description: 'Weak ETag, format W/"v<sequence>".'
    TenantResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Tenant"
    TenantListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Tenant"
        pagination:
          $ref: "#/components/schemas/Pagination"
    CreateTenantRequest:
      type: object
