openapi: 3.1.0
info:
  title: SaaS Data Plane API
  version: 0.0.3
  description: Per-deployment data plane API. One vhost per Deployment under *.saas.omarss.net.
servers:
  - url: https://{env}.{project}.saas.omarss.net
    variables:
      env:
        default: dev
        description: Environment slug (dev, staging, prod).
      project:
        default: example
        description: Project slug for the Deployment.
tags:
  - name: meta
    description: Health and metadata.
  - name: tenants
    description: Tenant CRUD. Tenant is the unit of isolation and billing.
  - name: users
    description: |
      Identity façade for the data plane. Wraps Keycloak; consumers never
      see Keycloak details. Email and other PII are envelope-encrypted at
      rest (see AGENTS.md §18.7).
  - name: social-providers
    description: |
      Social login linking via Keycloak's IdP brokering. POST returns a
      Keycloak-brokered authorization URL — the caller redirects there
      and Keycloak completes the OAuth dance + writes the federated_identity
      row itself. ADR 014 records the design.
security:
  - bearerAuth: []
  - apiKeyAuth: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [meta]
      summary: Liveness probe.
      description: Returns 200 with a small status payload when the data plane is alive.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      summary: List tenants visible to the caller's Deployment.
      description: |
        Returns the tenants the caller is authorised to see. In Phase 2 the
        Data Plane caller's token resolves to exactly one tenant, so the list
        contains one element. Operator impersonation across tenants lands in
        Phase 13.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          $ref: "#/components/responses/CursorGone"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Create a tenant. Auto-creates a default Organization.
      description: |
        Idempotent. Replays with the same Idempotency-Key + body return the
        cached 201 response; with the same key + a different body return 422
        idempotency-key-conflict (see AGENTS.md section 5.2).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        "201":
          description: Created
          headers:
            ETag:
              schema:
                type: string
              description: 'Weak ETag, format W/"v<sequence>".'
            Location:
              schema:
                type: string
              description: URI of the created tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/IdempotencyInFlight"
        "422":
          $ref: "#/components/responses/IdempotencyConflictOrValidation"
  /v1/tenants/{tenant_id}:
    parameters:
      - in: path
        name: tenant_id
        required: true
        schema:
          type: string
          pattern: "^tenant_[0-9A-HJKMNP-TV-Z]{26}$"
    get:
      operationId: getTenant
      tags: [tenants]
      summary: Fetch a tenant by id.
      description: Returns the tenant if the caller's tenant context matches the path id; 403 otherwise.
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
              description: 'Weak ETag, format W/"v<sequence>".'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTenant
      tags: [tenants]
      summary: Update a tenant. Idempotent. ETag concurrency control required.
      description: |
        PATCH requires the current Weak ETag in If-Match; a stale ETag returns 412.
        Idempotency-Key replays the cached response when the body hash matches.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantRequest"
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/IdempotencyConflictOrValidation"
    delete:
      operationId: deleteTenant
      tags: [tenants]
      summary: Soft-delete a tenant. Retention applies before physical purge.
      description: |
        Soft-deletes the tenant; status flips to "deleted" and a retention window
        applies before any physical purge (purge endpoint lands in Phase 18).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Soft-deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /v1/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users in the caller's tenant.
      description: |
        Returns the platform users belonging to the caller's tenant. Email
        plaintext is returned (decrypted at the persistence boundary); the
        envelope columns stay on the server. Set the `email` query parameter
        to look up a single user by email (HMAC-prefix lookup; never sends
        plaintext to the DB).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Sort"
        - in: query
          name: email
          required: false
          description: HMAC-prefix lookup; matches on email_lookup_hash.
          schema:
            type: string
            format: email
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          $ref: "#/components/responses/CursorGone"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a platform user. Mirrors the row into Keycloak.
      description: |
        Idempotent. The platform creates a row + a Keycloak user in the
        shared `saas-data-local` realm (per-Deployment realm lands in Phase 12).
        Email is envelope-encrypted; an HMAC-SHA256 lookup hash backs the
        per-tenant uniqueness index.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created
          headers:
            ETag:
              schema:
                type: string
              description: 'Weak ETag, format W/"v<sequence>".'
            Location:
              schema:
                type: string
              description: URI of the created user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/IdempotencyInFlight"
        "422":
          $ref: "#/components/responses/IdempotencyConflictOrValidation"

  /v1/users/{user_id}:
    parameters:
      - in: path
        name: user_id
        required: true
        schema:
          type: string
          pattern: "^user_[0-9A-HJKMNP-TV-Z]{26}$"
    get:
      operationId: getUser
      tags: [users]
      summary: Fetch a platform user by id.
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
              description: 'Weak ETag, format W/"v<sequence>".'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a platform user. ETag concurrency control required.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/IdempotencyConflictOrValidation"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Soft-delete a platform user. Disables the Keycloak user.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Soft-deleted (status=deleted; Keycloak Enabled=false).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /v1/users/{user_id}/disable:
    parameters:
      - in: path
        name: user_id
        required: true
        schema:
          type: string
          pattern: "^user_[0-9A-HJKMNP-TV-Z]{26}$"
    post:
      operationId: disableUser
      tags: [users]
      summary: Disable a platform user. Emits user.disabled.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/users/{user_id}/enable:
    parameters:
      - in: path
        name: user_id
        required: true
        schema:
          type: string
          pattern: "^user_[0-9A-HJKMNP-TV-Z]{26}$"
    post:
      operationId: enableUser
      tags: [users]
      summary: Enable a previously-disabled platform user.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/users/{user_id}/reset-password:
    parameters:
      - in: path
        name: user_id
        required: true
        schema:
          type: string
          pattern: "^user_[0-9A-HJKMNP-TV-Z]{26}$"
    post:
      operationId: triggerPasswordReset
      tags: [users]
      summary: Trigger a password-reset email via Keycloak.
      description: |
        Phase 5 uses Keycloak's built-in SMTP (ExecuteActionsEmail with
        UPDATE_PASSWORD). Phase 6 swaps the transport to the Notifications
        module + Novu without changing this endpoint.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Reset email queued.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/users/{user_id}/verify-email:
    parameters:
      - in: path
        name: user_id
        required: true
        schema:
          type: string
          pattern: "^user_[0-9A-HJKMNP-TV-Z]{26}$"
    post:
      operationId: triggerEmailVerify
      tags: [users]
      summary: Trigger an email-verification action via Keycloak.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Verify-email action queued.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/users/{user_id}/social-providers:
    parameters:
      - in: path
        name: user_id
        required: true
        schema:
          type: string
          pattern: "^user_[0-9A-HJKMNP-TV-Z]{26}$"
    get:
      operationId: listSocialProviders
      tags: [social-providers]
      summary: List linked social providers for a user.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialProviderListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: linkSocialProvider
      tags: [social-providers]
      summary: Start a social-provider link flow. Returns the Keycloak link URL.
      description: |
        Per ADR 014: we never call CreateUserFederatedIdentity from a
        user-facing endpoint (no proof-of-possession). Instead, the platform
        mints Keycloak's hashed link URL — the caller redirects the user's
        browser there and Keycloak completes the OAuth dance with the
        external IdP, writing the federated_identity row itself.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkSocialProviderRequest"
      responses:
        "202":
          description: Accepted; caller must redirect to authorization_url.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkSocialProviderResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/IdempotencyConflictOrValidation"

  /v1/users/{user_id}/social-providers/{provider}:
    parameters:
      - in: path
        name: user_id
        required: true
        schema:
          type: string
          pattern: "^user_[0-9A-HJKMNP-TV-Z]{26}$"
      - in: path
        name: provider
        required: true
        schema:
          type: string
          enum: [google, github, apple]
    delete:
      operationId: unlinkSocialProvider
      tags: [social-providers]
      summary: Unlink a social provider. Emits user.social_unlinked.
      responses:
        "204":
          description: Unlinked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
        commit:
          type: string
    Tenant:
      type: object
      required:
        - id
        - object
        - slug
        - name
        - status
        - created_at
        - updated_at
        - etag
      properties:
        id:
          type: string
          pattern: "^tenant_[0-9A-HJKMNP-TV-Z]{26}$"
        object:
          type: string
          enum: [tenant]
        slug:
          type: string
          minLength: 2
          maxLength: 32
          pattern: "^[a-z][a-z0-9-]*[a-z0-9]$"
        name:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: string
          enum: [active, suspended, deleted]
        default_organization_id:
          type: string
          nullable: true
          pattern: "^org_[0-9A-HJKMNP-TV-Z]{26}$"
        metadata:
          $ref: "#/components/schemas/Metadata"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
        etag:
          type: string
          description: 'Weak ETag, format W/"v<sequence>".'
    TenantResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Tenant"
    TenantListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Tenant"
        pagination:
          $ref: "#/components/schemas/Pagination"
    CreateTenantRequest:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          minLength: 2
          maxLength: 32
          pattern: "^[a-z][a-z0-9-]*[a-z0-9]$"
        name:
          type: string
          minLength: 1
          maxLength: 120
        metadata:
          $ref: "#/components/schemas/Metadata"
    UpdateTenantRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: string
          enum: [active, suspended]
        metadata:
          $ref: "#/components/schemas/Metadata"
    Metadata:
      type: object
      maxProperties: 16
      additionalProperties:
        type: string
        maxLength: 256
    User:
      type: object
      required:
        - id
        - object
        - tenant_id
        - email
        - email_verified
        - status
        - created_at
        - updated_at
        - etag
      properties:
        id:
          type: string
          pattern: "^user_[0-9A-HJKMNP-TV-Z]{26}$"
        object:
          type: string
          enum: [user]
        tenant_id:
          type: string
          pattern: "^tenant_[0-9A-HJKMNP-TV-Z]{26}$"
        email:
          type: string
          format: email
          x-oapi-codegen-extra-tags:
            pii: "true"
            sensitive: "true"
        email_verified:
          type: boolean
        name:
          type: string
          nullable: true
          x-oapi-codegen-extra-tags:
            pii: "true"
        phone:
          type: string
          nullable: true
          x-oapi-codegen-extra-tags:
            pii: "true"
            sensitive: "true"
        status:
          type: string
          enum: [active, disabled, deleted]
        metadata:
          $ref: "#/components/schemas/Metadata"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        etag:
          type: string
          description: 'Weak ETag, format W/"v<sequence>".'
    UserResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/User"
    UserListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        pagination:
          $ref: "#/components/schemas/Pagination"
    CreateUserRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          x-oapi-codegen-extra-tags:
            pii: "true"
            sensitive: "true"
        name:
          type: string
          x-oapi-codegen-extra-tags:
            pii: "true"
        send_verification_email:
          type: boolean
          default: true
        metadata:
          $ref: "#/components/schemas/Metadata"
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          x-oapi-codegen-extra-tags:
            pii: "true"
        phone:
          type: string
          x-oapi-codegen-extra-tags:
            pii: "true"
            sensitive: "true"
        metadata:
          $ref: "#/components/schemas/Metadata"
    SocialProvider:
      type: object
      required: [provider, external_subject, linked_at]
      properties:
        provider:
          type: string
          enum: [google, github, apple]
        external_subject:
          type: string
          x-oapi-codegen-extra-tags:
            sensitive: "true"
        linked_at:
          type: string
          format: date-time
    SocialProviderListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SocialProvider"
    LinkSocialProviderRequest:
      type: object
      required: [provider, return_to]
      properties:
        provider:
          type: string
          enum: [google, github, apple]
        return_to:
          type: string
          format: uri
          maxLength: 2048
    LinkSocialProviderResponse:
      type: object
      required: [authorization_url, state, expires_at]
      properties:
        authorization_url:
          type: string
          format: uri
        state:
          type: string
        expires_at:
          type: string
          format: date-time
    Pagination:
      type: object
      required: [has_more]
      properties:
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
        code:
          type: string
  parameters:
    Limit:
      in: query
      name: limit
      required: false
      description: Max items to return (default 25, max 200).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 25
    Cursor:
      in: query
      name: cursor
      required: false
      description: Opaque pagination cursor; obtained from a previous response.
      schema:
        type: string
    Sort:
      in: query
      name: sort
      required: false
      description: Sort token. Default "-created_at".
      schema:
        type: string
        default: "-created_at"
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: 24-hour idempotency key (idem_<ulid>).
      schema:
        type: string
        pattern: "^idem_[0-9A-HJKMNP-TV-Z]{26}$"
    IfMatch:
      in: header
      name: If-Match
      required: true
      description: Weak ETag from a prior GET; rejects on mismatch with 412.
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid bearer token / API key.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Caller lacks permission for this resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: If-Match header missing or stale.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    IdempotencyInFlight:
      description: Concurrent request with the same Idempotency-Key is still processing.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    IdempotencyConflictOrValidation:
      description: Idempotency-Key reused with a different body, OR validation failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CursorGone:
      description: Cursor schema version is no longer supported.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Rate limit exceeded.
      headers:
        RateLimit-Limit:
          schema:
            type: integer
        RateLimit-Remaining:
          schema:
            type: integer
        RateLimit-Reset:
          schema:
            type: integer
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
