overlay: 1.0.0
info:
  title: Downgrade 3.1 -> 3.0 for oapi-codegen
  version: 0.0.0
actions:
  # Re-stamp the document as 3.0.3 so oapi-codegen accepts it. Our schemas avoid
  # 3.1-only constructs (prefixItems, unevaluatedProperties, $dynamicRef,
  # type:[X, "null"]); when one of those is introduced, add a corresponding
  # action with a JSONPath filter that the Overlay engine in use accepts.
  - target: "$.openapi"
    update: "3.0.3"
