package: controlplaneclient
output: sdk/go/controlplane/client.gen.go
generate:
  models: true
  client: true
# response-type-suffix renames the WithResponse wrapper types (e.g.
# CreateDeploymentResponseResp instead of CreateDeploymentResponse) so they
# don't collide with model schemas that happen to be named "*Response".
# Keeps the spec untouched and the wire shape unchanged.
output-options:
  skip-fmt: false
  skip-prune: false
  response-type-suffix: Resp
  overlay:
    path: openapi/overlays/30-downgrade.yaml
