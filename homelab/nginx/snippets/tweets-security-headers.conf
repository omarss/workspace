# Security headers shared by every location block in tweets.omarss.net.conf.
#
# nginx's add_header does NOT inherit across contexts: any location
# that sets its own add_header drops all of the parent's headers. Each
# location includes this snippet to re-assert them.
#
# CSP is the strict JSON-API variant — connect-src 'self' is the only
# thing a /tweets consumer needs, no scripts or styles are served from
# this host. Cross-Origin-Resource-Policy is `cross-origin` (unlike
# apps.omarss.net which is same-origin) because the Android client
# treats this as an external resource over HTTPS.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'none'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "cross-origin" always;
