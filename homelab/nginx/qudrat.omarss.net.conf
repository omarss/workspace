# Managed by certbot — this is the pre-certbot base config.
# After `make apply-nginx` run: sudo certbot --nginx -d qudrat.omarss.net
# certbot will inject the TLS server block + 80 → 443 redirect alongside.
#
# qudrat: assessment-content platform for Qudurat / Tahsili practice.
# k3s NodePort 30803 (qudrat-api Service in the qudrat namespace).
# Domain will move to qudrat.ai once DNS is set up — add a second
# `server_name` line then; the certbot-issued listener handles both.

server {
    listen 80;
    listen [::]:80;
    server_name qudrat.omarss.net;

    server_tokens off;
    charset utf-8;

    # Phase 1 surface is tiny (status banner + healthz). Phase 5 lifts
    # this once Next.js client uploads (multipart for photo Q&A) land.
    client_max_body_size 64k;
    client_body_timeout  10s;

    include /etc/nginx/snippets/apps-security-headers.conf;

    # Health probes (used by external monitoring; the in-cluster probes
    # talk to the pod directly via the kubelet, not through nginx).
    location = /healthz {
        proxy_pass http://127.0.0.1:30803/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 1s;
        proxy_read_timeout    2s;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:30803/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 1s;
        proxy_read_timeout    2s;
    }

    # Everything else proxies to the qudrat api. Phase 5 splits this into
    # `/` → Next.js NodePort and `/api/*` → this NodePort.
    location / {
        include /etc/nginx/snippets/apps-security-headers.conf;
        proxy_pass http://127.0.0.1:30803;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;
        proxy_send_timeout    4s;
    }

    access_log /var/log/nginx/qudrat.omarss.net.access.log;
    error_log  /var/log/nginx/qudrat.omarss.net.error.log;
}
