# Managed by certbot — this is the pre-certbot base config.
# After `make apply-nginx` run: sudo certbot --nginx -d qudrat.omarss.net
# certbot will inject the TLS server block + 80 → 443 redirect alongside.
#
# qudrat: assessment-content platform for Qudurat / Tahsili practice.
#   /            → qudrat-web (Next.js, NodePort 30804)
#   /api/*       → qudrat-api (Go,       NodePort 30803)
#   /webhooks/*  → qudrat-bot (Telegram + Twilio inbound, NodePort 30805)
#   /healthz     → qudrat-api healthz
#   /readyz      → qudrat-api readyz
# Domain will move to qudrat.ai once DNS is set up — add a second
# `server_name` line then; the certbot-issued listener handles both.

server {
    listen 80;
    listen [::]:80;
    server_name qudrat.omarss.net;

    server_tokens off;
    charset utf-8;

    # Photo Q&A (Phase 10) wants higher; lift then.
    client_max_body_size 256k;
    client_body_timeout  10s;

    include /etc/nginx/snippets/qudrat-security-headers.conf;

    # Health probes for the api (used by external monitoring; in-cluster
    # probes go straight to the pod).
    location = /healthz {
        proxy_pass http://127.0.0.1:30803/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 1s;
        proxy_read_timeout    2s;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:30803/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 1s;
        proxy_read_timeout    2s;
    }

    # API surface: everything under /api/* goes to the Go service.
    location /api/ {
        include /etc/nginx/snippets/qudrat-security-headers.conf;
        proxy_pass http://127.0.0.1:30803;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;
        proxy_send_timeout    4s;
    }

    # Twilio (and any future) webhooks → qudrat-bot. Twilio's signature
    # validation needs Host + X-Forwarded-Proto so it can reconstruct the
    # originally-signed URL on the server side.
    location /webhooks/ {
        include /etc/nginx/snippets/qudrat-security-headers.conf;
        proxy_pass http://127.0.0.1:30805;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout    15s;
        proxy_send_timeout    4s;
    }

    # Everything else → Next.js. Includes /, /login, /practice, /_next/static, etc.
    location / {
        include /etc/nginx/snippets/qudrat-security-headers.conf;
        proxy_pass http://127.0.0.1:30804;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout    15s;
        proxy_send_timeout    4s;
    }

    access_log /var/log/nginx/qudrat.omarss.net.access.log;
    error_log  /var/log/nginx/qudrat.omarss.net.error.log;
}
