# Managed by certbot — this is the pre-certbot base config.
# After running: sudo certbot --nginx -d tweets.omarss.net
# certbot will inject the TLS server block + 80 → 443 redirect alongside.
#
# Reverse-proxies the local tweetsd service (systemd unit on
# 127.0.0.1:8088). All scraping + spam filtering happens inside tweetsd;
# nginx exists only to terminate TLS and to be the public surface the
# Android client reaches via tweets.omarss.net.
#
# This service holds the user's X session cookies (in /srv/tweets), so
# the surface area exposed to the internet should stay narrow. We allow
# only GET /healthz and GET /tweets — anything else 404s without ever
# reaching the backend.

server {
    listen 80;
    listen [::]:80;
    server_name tweets.omarss.net;

    server_tokens off;
    autoindex off;
    charset utf-8;

    # Conservative request envelope. Bodies are never used (handlers are
    # GET-only), so a 1k ceiling is generous.
    client_max_body_size 1k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 10s;

    # Security headers applied at the server scope; every location with
    # its own add_header re-includes (no inheritance in nginx).
    include /etc/nginx/snippets/tweets-security-headers.conf;

    # Block everything except the two endpoints we actually expose.
    # nginx evaluates the `location =` matches first, so anything not
    # matched falls through to the default 404 below.
    location = /healthz {
        include /etc/nginx/snippets/tweets-security-headers.conf;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:8088/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Quick timeout — this should answer in milliseconds.
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location = /tweets {
        include /etc/nginx/snippets/tweets-security-headers.conf;
        # 30-second cache so a phone refreshing in a tight loop doesn't
        # hammer the backend; the data behind /tweets only changes when
        # the scrape loop ticks (10 min default), so 30s is far inside
        # the freshness budget.
        add_header Cache-Control "public, max-age=30" always;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:8088/tweets$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location / {
        include /etc/nginx/snippets/tweets-security-headers.conf;
        return 404;
    }
}
