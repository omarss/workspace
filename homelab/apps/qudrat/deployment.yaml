apiVersion: apps/v1
kind: Deployment
metadata:
  name: qudrat-api
  namespace: qudrat
  labels:
    app.kubernetes.io/name: qudrat
    app.kubernetes.io/component: api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: qudrat
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qudrat
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Image is loaded into k3s's containerd via `make image-load-api`
          # from the qudrat.ai repo. k3s sees `localhost/…` once imported.
          image: localhost/qudrat/api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: QUDRAT_HTTP_ADDR
              value: ":8080"
            - name: QUDRAT_COOKIE_DOMAIN
              value: "qudrat.omarss.net"
            - name: QUDRAT_COOKIE_SECURE
              value: "true"
          envFrom:
            - secretRef:
                name: qudrat-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
