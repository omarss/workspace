apiVersion: apps/v1
kind: Deployment
metadata:
  name: qudrat-web
  namespace: qudrat
  labels:
    app.kubernetes.io/name: qudrat
    app.kubernetes.io/component: web
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: qudrat
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qudrat
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Image is loaded into k3s containerd via `make image-load-web`
          # from the qudrat.ai repo.
          image: localhost/qudrat/web:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            # Server-side fetches inside the Next.js render path (e.g. the
            # landing page banner) talk to the api Service in-cluster.
            - name: QUDRAT_API_URL
              value: "http://qudrat-api.qudrat.svc.cluster.local:8080"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "384Mi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
