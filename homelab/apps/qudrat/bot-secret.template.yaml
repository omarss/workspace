# TEMPLATE ONLY — do NOT `kubectl apply` this file directly. Real secret
# is created out-of-band:
#
#   BOT_TOKEN=$(openssl rand -hex 32)
#   # Set the same token on qudrat-api so /api/auth/external accepts it:
#   kubectl -n qudrat patch secret qudrat-secrets --type=merge \
#     -p "{\"stringData\":{\"QUDRAT_BOT_AUTH_TOKEN\":\"${BOT_TOKEN}\"}}"
#   kubectl -n qudrat create secret generic qudrat-bot-secrets \
#     --from-literal=QUDRAT_BOT_AUTH_TOKEN="${BOT_TOKEN}" \
#     --from-literal=QUDRAT_BOT_TELEGRAM_TOKEN="<token from @BotFather>" \
#     --from-literal=QUDRAT_BOT_TWILIO_ACCOUNT_SID="" \
#     --from-literal=QUDRAT_BOT_TWILIO_AUTH_TOKEN="" \
#     --from-literal=QUDRAT_BOT_TWILIO_FROM="" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Configure the Telegram webhook NOT — the bot uses long-poll (no inbound
# URL needed). For Twilio WhatsApp, set the inbound webhook URL in the
# Twilio Console to:
#   https://qudrat.omarss.net/webhooks/twilio/whatsapp
apiVersion: v1
kind: Secret
metadata:
  name: qudrat-bot-secrets
  namespace: qudrat
type: Opaque
stringData:
  QUDRAT_BOT_AUTH_TOKEN: "REPLACE_ME"
  QUDRAT_BOT_TELEGRAM_TOKEN: ""
  QUDRAT_BOT_TWILIO_ACCOUNT_SID: ""
  QUDRAT_BOT_TWILIO_AUTH_TOKEN: ""
  QUDRAT_BOT_TWILIO_FROM: ""
