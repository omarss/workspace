# TEMPLATE ONLY — do NOT `kubectl apply` this file directly (it would
# overwrite the live secret's real values with "REPLACE_ME"). It lives
# in git so whoever re-bootstraps the cluster knows which keys the
# qudrat-api Deployment expects.
#
# Create or rotate the real secret:
#
#   openssl rand -hex 32 > ~/.config/qudrat/db-password
#   chmod 600 ~/.config/qudrat/db-password
#   DB_PASS=$(cat ~/.config/qudrat/db-password)
#   kubectl create namespace qudrat --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n qudrat create secret generic qudrat-secrets \
#     --from-literal=QUDRAT_DATABASE_DSN="postgresql://qudrat:${DB_PASS}@10.42.0.1:5432/qudrat?sslmode=disable" \
#     --from-literal=QUDRAT_TWILIO_ACCOUNT_SID=REPLACE_ME \
#     --from-literal=QUDRAT_TWILIO_AUTH_TOKEN=REPLACE_ME \
#     --from-literal=QUDRAT_TWILIO_VERIFY_SERVICE_SID=REPLACE_ME \
#     --from-literal=QUDRAT_RESEND_API_KEY=REPLACE_ME \
#     --from-literal=QUDRAT_RESEND_FROM=REPLACE_ME \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# 10.42.0.1 is the default k3s host-gateway IP — the API reaches the
# host-resident Postgres through it. Verify with:
#   ip -4 addr show cni0 | awk '/inet /{print $2}'
#
# Postgres must allow connections from the 10.42.0.0/16 pod CIDR —
# add the following line to /etc/postgresql/*/main/pg_hba.conf if not
# already present, then `sudo systemctl reload postgresql`:
#   host  qudrat  qudrat  10.42.0.0/16  scram-sha-256
#
# Twilio + Resend are optional in Phase 1. Until they're set, the api
# falls back to the devlog notifier (logs OTPs) for SMS and silently
# does the same for email — those code paths land in Phase 2.
apiVersion: v1
kind: Secret
metadata:
  name: qudrat-secrets
  namespace: qudrat
type: Opaque
stringData:
  QUDRAT_DATABASE_DSN: "postgresql://qudrat:REPLACE_ME@10.42.0.1:5432/qudrat?sslmode=disable"
  QUDRAT_TWILIO_ACCOUNT_SID: "REPLACE_ME"
  QUDRAT_TWILIO_AUTH_TOKEN: "REPLACE_ME"
  QUDRAT_TWILIO_VERIFY_SERVICE_SID: "REPLACE_ME"
  QUDRAT_RESEND_API_KEY: "REPLACE_ME"
  QUDRAT_RESEND_FROM: "REPLACE_ME"
