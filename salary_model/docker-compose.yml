# Local development stack: API service with persistent data and artifacts volumes.
# Bring up with `docker compose up --build` (or `podman compose ...`).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: salary-model:local
    container_name: salary-model-api
    ports:
      - "8080:8080"
    environment:
      SALARY_MODEL_LOG_JSON: "true"
      SALARY_MODEL_LOG_LEVEL: "INFO"
    volumes:
      - ./data:/data:ro
      - ./artifacts:/artifacts:ro
      - ./reports:/reports:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
