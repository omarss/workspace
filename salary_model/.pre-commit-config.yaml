# Pre-commit hooks. Install with: `uv run pre-commit install` (after `pip install pre-commit`).
# CI re-runs the same checks; pre-commit just catches them earlier.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest-fast
        name: pytest (not slow, not network)
        entry: uv run pytest -m "not slow and not network" -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
