[project]
name = "salary-model"
version = "0.1.0"
description = "Saudi Arabia labor-market intelligence and salary distribution model"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Omar Shaaban", email = "omar.s.shaaban@gmail.com" }]

dependencies = [
  # Core scientific
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "pyarrow>=16",
  # Models
  "lightgbm>=4.5,<5",
  "catboost>=1.2,<2",
  "mapie>=0.9,<1",
  "optuna>=3.6,<5",
  # Probabilistic (v2)
  "numpyro>=0.15,<1",
  "jax>=0.4.30,<1",
  "jaxlib>=0.4.30,<1",
  # Embeddings (title/skill similarity)
  "sentence-transformers>=3.0,<5",
  "faiss-cpu>=1.8,<2",
  # Tracking + config
  "mlflow>=2.16,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<14",
  # API
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  # Data sources (open APIs)
  "httpx>=0.27,<1",
  "wbdata>=1.0,<2",
  # Explainability
  "shap>=0.46,<1",
  "numba>=0.60",                # required by shap; old wheels miss 3.12 support
  "llvmlite>=0.43",
  # Persistence
  "joblib>=1.4,<2",
  "structlog>=24.4,<25",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "ruff>=0.6,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<8",
  "pytest-asyncio>=0.24,<1",
  "hypothesis>=6.112,<7",
  "pre-commit>=4.0,<5",
  "types-requests",
  "pandas-stubs",
]

[project.scripts]
salary-model = "salary_model.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salary_model"]

# ── Tooling ──────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",          # pycodestyle / pyflakes
  "I",                    # isort
  "B",                    # flake8-bugbear
  "UP",                   # pyupgrade
  "N",                    # pep8-naming
  "SIM",                  # simplify
  "PL",                   # pylint
  "RUF",                  # ruff
  "S",                    # security
  "PTH",                  # use pathlib
  "TID",                  # tidy imports
  "ANN",                  # type-annotation hygiene
]
ignore = [
  "ANN401",   # allow Any in narrow places
  "PLR0911",  # multi-return is fine when each return is explicit early-exit
  "PLR0912",  # branch count: calibrate has many branches but reads top-to-bottom
  "PLR0913",  # function arg counts in model training are unavoidable
  "PLR0915",  # iteration runner is intentionally long-form
  "PLR2004",  # magic numbers OK in eval thresholds with comments
  "PLC0415",  # lazy/inline imports are intentional (heavy deps, optional NumPyro)
  "PLW0603",  # singleton pattern uses global; localized and reviewed
  "RUF001",   # Arabic strings contain "ambiguous" Unicode legitimately
  "RUF003",   # Arabic in comments likewise
  "S101",     # asserts in tests
  "N803",     # uppercase `X` is standard ML convention (sklearn-style)
  "N806",     # ditto for in-function `X`, `Z`
]
exclude = ["build", "dist", ".venv", "data", "artifacts"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S", "PL"]
"scripts/**" = ["S"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_return_any = true
warn_unreachable = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true            # third-party stub coverage varies
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
exclude = ["build", "dist", ".venv", "artifacts", "data"]

[[tool.mypy.overrides]]
module = ["lightgbm.*", "catboost.*", "mapie.*", "optuna.*", "shap.*", "faiss.*",
          "sentence_transformers.*", "wbdata.*", "numpyro.*", "jax.*", "mlflow.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config"
markers = [
  "slow: long-running tests (model training, end-to-end iteration)",
  "network: requires internet access to data sources",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
  "ignore::UserWarning",
]

[tool.coverage.run]
branch = true
source = ["salary_model"]

[tool.coverage.report]
skip_empty = true
precision = 1
show_missing = true
