[project]
name = "job-crawler-db"
version = "0.1.0"
description = "Async PostgreSQL facade for the job_crawler schema: ingest, dedupe, search, score."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Omar Shaaban", email = "omar.s.shaaban@gmail.com" }]
keywords = ["jobs", "crawler", "postgres", "search", "arabic"]

# Why these libs (and only these):
#   psycopg[binary,pool] : official PG3 driver — async-capable, prepared statements,
#                          AsyncConnectionPool, native binary protocol. Stable, fast.
#   pydantic             : strict typed DTOs at the API boundary. Skipped for hot
#                          read paths (we use `class_row` + dataclasses there).
dependencies = [
    "psycopg[binary,pool]>=3.2.3",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# `api` — the FastAPI service at jobs.omarss.net
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
# `crawler` — runtime deps for the per-source crawlers
# All MIT/BSD/Apache-2 licensed open-source libraries. Zero paid APIs.
crawler = [
    "httpx[http2]>=0.27",          # MIT — HTTP client
    "selectolax>=0.3.21",          # MIT — HTML parsing
    "lxml>=5.3",                   # BSD — HTML/XML fallback
    "tenacity>=9.0",               # Apache-2 — retries
    "python-dotenv>=1.0",          # BSD-3 — env loading
    "aiosmtplib>=4.0",             # MIT — async SMTP for alerts (no paid API)
    "curl_cffi>=0.7",              # MIT — TLS-fingerprint impersonation for bot-walled sites
    "playwright>=1.49",            # Apache-2 — headless browser for SPA / JS-walled sites
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
    "fastapi>=0.115",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/omarshaaban/job_crawler"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_crawler_db", "src/job_crawler_api", "src/job_crawler"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that require a real PostgreSQL container",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by formatter
    "SIM117", # nested `async with` is intentional for pool + tx + cursor stacks
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B017"]  # broad pytest.raises is fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
exclude = ["build/", "dist/"]

[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "playwright.*"
ignore_missing_imports = true
