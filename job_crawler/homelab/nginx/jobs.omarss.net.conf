# Managed by certbot — this is the pre-certbot base config.
# After `make apply-nginx` in homelab run: sudo certbot --nginx -d jobs.omarss.net
# certbot will inject the TLS server block + 80 → 443 redirect alongside.
#
# Proxies to the k3s `job-crawler-api` Service via NodePort 30810.
# Geofence to SA is enforced at the iptables/ipset layer (homelab/geofence).

upstream job_crawler_api {
    server 127.0.0.1:30810 max_fails=2 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name jobs.omarss.net;

    server_tokens off;
    charset utf-8;

    # Conservative limits — the API only handles small JSON payloads + a
    # tiny static dashboard. No file uploads.
    client_max_body_size 32k;
    client_body_timeout  5s;

    # NB: every location that adds its own header MUST re-include the
    # security snippet, because nginx's add_header has no inheritance
    # when a child context defines any add_header of its own.
    include /etc/nginx/snippets/apps-security-headers.conf;

    # ACME challenge — keep available even if everything else 503s.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # ── Static dashboard (served by FastAPI's StaticFiles) ──────────────
    location = / {
        include /etc/nginx/snippets/apps-security-headers.conf;
        proxy_pass http://job_crawler_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;
        proxy_send_timeout    5s;
    }

    location /static/ {
        include /etc/nginx/snippets/apps-security-headers.conf;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        proxy_pass http://job_crawler_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;
    }

    # ── JSON API ─────────────────────────────────────────────────────────
    location /v1/ {
        include /etc/nginx/snippets/apps-security-headers.conf;
        # Tight defaults; search can occasionally take >2s on cold cache.
        proxy_pass http://job_crawler_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 2s;
        proxy_read_timeout    15s;
        proxy_send_timeout    5s;
    }

    # Reject anything else.
    location / {
        include /etc/nginx/snippets/apps-security-headers.conf;
        return 404;
    }
}
