# NodePort 30810 so the host nginx reverse-proxy can reach the pod at
# http://127.0.0.1:30810 without an Ingress. Allocated after 30801 (places),
# 30802 (mcqs), 30803 (qudrat); 30804-30809 were skipped because 30804 was
# already claimed in-cluster. Keep this in sync with the nginx vhost.
apiVersion: v1
kind: Service
metadata:
  name: job-crawler-api
  namespace: job-crawler
  labels:
    app.kubernetes.io/name: job-crawler-api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: job-crawler-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30810
      protocol: TCP
