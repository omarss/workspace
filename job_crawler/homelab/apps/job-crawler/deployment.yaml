apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-crawler-api
  namespace: job-crawler
  labels:
    app.kubernetes.io/name: job-crawler-api
    app.kubernetes.io/component: api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: job-crawler-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: job-crawler-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Image is loaded into k3s's containerd via `make load-image` from
          # this repo. k3s sees `localhost/...` once imported.
          image: localhost/job-crawler:latest
          imagePullPolicy: IfNotPresent
          args: ["api"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: job-crawler-config
            - secretRef:
                name: job-crawler-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
