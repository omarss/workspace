# Per-source CronJobs. Each one runs `crawler <slug>` via the same image
# as the API; the entrypoint script dispatches.
#
# Scheduling spread is intentional — no two crawlers should hit the same
# host at the same minute. Cron timezone is UTC (k3s default).
#
# All jobs:
#   * inherit env from the configmap + secret
#   * have generous timeouts but tight resource limits
#   * keep one prior failed pod for forensics

---
# Greenhouse — many SA-resident companies (PIF portfolio, NEOM, Tabby…) host
# their public boards on Greenhouse. Cheap JSON API; runs often.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: job-crawler-greenhouse
  namespace: job-crawler
spec:
  schedule: "17 */4 * * *"      # every 4h at :17
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800   # 30 minutes
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: crawler
              image: localhost/job-crawler:latest
              imagePullPolicy: IfNotPresent
              args: ["crawler", "greenhouse"]
              envFrom:
                - configMapRef: { name: job-crawler-config }
                - secretRef:    { name: job-crawler-secrets }
              resources:
                requests: { cpu: "50m", memory: "192Mi" }
                limits:   { cpu: "500m", memory: "512Mi" }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }

---
# Bayt — internal JSON endpoint, polite HTTP with per-host throttle.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: job-crawler-bayt
  namespace: job-crawler
