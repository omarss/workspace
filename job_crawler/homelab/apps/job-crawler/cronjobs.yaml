---
# Canary — runs every hour, one synthetic fetch per enabled source.
# Trips the breakage detector fast when a site changes.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: job-crawler-canary
  namespace: job-crawler
spec:
  schedule: "47 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: canary
              image: localhost/job-crawler:latest
              imagePullPolicy: IfNotPresent
              args: ["canary", "all"]
              envFrom:
                - configMapRef: { name: job-crawler-config }
                - secretRef:    { name: job-crawler-secrets }
              resources:
                requests: { cpu: "25m", memory: "96Mi" }
                limits:   { cpu: "250m", memory: "256Mi" }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }

---
# Companies discovery — weekly Wikidata SPARQL pull + seed CSV reconciliation.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: job-crawler-discover
  namespace: job-crawler
spec:
  schedule: "13 3 * * 1"        # Mondays 03:13 UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: discover
              image: localhost/job-crawler:latest
              imagePullPolicy: IfNotPresent
              args: ["discover", "--all"]
              envFrom:
                - configMapRef: { name: job-crawler-config }
                - secretRef:    { name: job-crawler-secrets }
              resources:
                requests: { cpu: "50m", memory: "192Mi" }
                limits:   { cpu: "500m", memory: "512Mi" }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
